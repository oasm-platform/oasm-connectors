# connector image (SDK+tool) — built from ./Dockerfile, not upstream image
name: Nuclei
slug: nuclei
version: 3.4.1
image: ghcr.io/oasm-platform/connector-nuclei:3.4.1
author: 'oasm'
license: free
shortDescription: 'Fast template-based vulnerability scanner'
description: 'Runs ProjectDiscovery Nuclei template-based scans against a target URL to detect known vulnerabilities, misconfigurations, and exposed secrets.'
capabilities: [vulnerabilities]
configSchema:
  type: object
  additionalProperties: false
  properties:
    severity:
      type: array
      items:
        type: string
        enum: [info, low, medium, high, critical]
    tags:
      type: array
      items:
        type: string
    excludeTags:
      type: array
      items:
        type: string
    templateIds:
      type: array
      items:
        type: string
    rateLimit:
      type: integer
      default: 150
    concurrency:
      type: integer
      default: 25
    followRedirects:
      type: boolean
resourceDefaults:
  cpu: 500m
  memory: 512Mi
  timeoutSeconds: 600
