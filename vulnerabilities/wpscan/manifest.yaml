name: WPScan - WordPress Security Scanner
slug: wpscan
version: 3.8.25
image: ghcr.io/oasm-platform/connector-wpscan:3.8.25
author: 'oasm'
pricingTier: [free]
homepage: 'https://wpscan.com'
repositoryUrl: 'https://github.com/oasm-platform/oasm-connectors'
