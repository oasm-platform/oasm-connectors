name: Nessus
slug: nessus
version: 0.1.0
image: ghcr.io/oasm-platform/connector-nessus:0.1.0
author: 'oasm'
license: free
shortDescription: 'Tenable Nessus vulnerability scanner'
description: 'Connects to a Tenable Nessus instance, creates and runs a scan against a target, and streams the discovered vulnerabilities back to the Worker as JSONL findings.'
capabilities: [vulnerabilities]
inputsSchema:
  type: object
  required: [target]
  properties:
    target:
      type: string
      format: uri
  additionalProperties: false
configSchema:
  type: object
  required: [url, username, password]
  properties:
    url:
      type: string
      format: uri
    username:
      type: string
    password:
      type: string
    accessKey:
      type: string
    secretKey:
      type: string
    templateUuid:
      type: string
    policyId:
      type: string
  additionalProperties: false
resourceDefaults:
  cpu: 500m
  memory: 512Mi
  timeoutSeconds: 600
