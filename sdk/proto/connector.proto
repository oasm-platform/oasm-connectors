syntax = "proto3";

package connector;

import "google/protobuf/timestamp.proto";

option go_package = "./connector";

message Register {
  string token = 1;
  string execution_id = 2;
  string job_id = 3;
  string tool = 4;
}

message RegisterAck {
  bool accepted = 1;
  string reason = 2;
}

message ExecuteJob {
  string execution_id = 1;
  string job_id = 2;
  string tool = 3;
  string image = 4;
  string trace_id = 5;
  map<string, string> inputs = 6;
  map<string, string> config = 7;
  // Platform category this job runs (e.g. "vulnerabilities"): one of the
  // connector's capabilities mapped to its category. Empty: the connector's default.
  string category = 8;
}

message Cancel {
  string execution_id = 1;
}

message Finding {
  string name = 1;
  string severity = 2;
  repeated string tags = 3;
  repeated string references = 4;
  repeated string cve_id = 5;
  repeated string cwe_id = 6;
  double cvss_score = 7;
  string cvss_metrics = 8;
  double epss_score = 9;
  string solution = 10;
  string matched_at = 11;
  string host = 12;
  string ip = 13;
  google.protobuf.Timestamp timestamp = 14;
  string description = 15;
  string synopsis = 16;
  repeated string ports = 17;
  repeated string authors = 18;
  double vpr_score = 19;
  repeated string bid_id = 20;
  repeated string iava = 21;
  google.protobuf.Timestamp publication_date = 22;
  google.protobuf.Timestamp modification_date = 23;
  double confidence = 24;
  repeated string cea_id = 25;

  // --- Code findings (repository scanners: secrets, dependencies, SAST) ---
  // All optional: host scanners leave them empty and old peers ignore them.
  // Path of the affected file, relative to the repository root.
  string file_path = 26;
  // 1-based line range of the finding within file_path (0 = unknown).
  int32 line_start = 27;
  int32 line_end = 28;
  // Commit the finding was observed in.
  string commit = 29;
  // Vulnerable dependency (SCA): package, the version in use, the fix.
  string package_name = 30;
  string installed_version = 31;
  string fixed_version = 32;
  // Stable identity of the finding within its asset, chosen by the
  // connector (e.g. rule + file + line). The platform dedupes on it, so many
  // findings of one rule in one repository stay distinct.
  string fingerprint = 33;
}

message Result {
  string execution_id = 1;
  bytes data = 2;
  bool is_error = 3;
  repeated Finding findings = 4;
}

message Done {
  string execution_id = 1;
  string error = 2;
}

// Connector → Worker messages (client stream)
message ConnectorMessage {
  oneof message {
    Register register = 1;
    Result result = 2;
    Done done = 3;
  }
}

// Worker → Connector messages (server stream)
message WorkerMessage {
  oneof message {
    RegisterAck register_ack = 1;
    ExecuteJob execute = 2;
    Cancel cancel = 3;
  }
}

service ConnectorService {
  // Bidirectional streaming: connector connects and exchanges messages
  rpc Connect(stream ConnectorMessage) returns (stream WorkerMessage);
}
