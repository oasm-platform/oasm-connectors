name: Build & Push All Connectors

# Two entry points, one pipeline:
#
#   pull_request        build + test only what the PR changed, publish nothing
#   workflow_dispatch   build + test the whole catalogue, then publish
#
# Both derive their matrix from the same detector the push-to-main pipeline
# uses (.github/scripts/detect-changed-connectors.sh), so a PR that touches one
# connector builds one image instead of all of them, and a dispatch still means
# "rebuild everything".
#
# Pushes to main are not handled here: build-changed-connectors.yml builds and
# publishes exactly the changed connectors, and running both would build the
# same images twice.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Override image tag (default: connector version from manifest.yaml)'
        required: false
        default: ''
      dry_run:
        description: 'Build and test only — do NOT push images'
        required: false
        default: false
        type: boolean
      scan_gate:
        description: 'Highest severity (or comma-separated list) that blocks a push. NONE = report only.'
        required: false
        default: ''
        type: string
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.playwright-mcp/**'

permissions:
  contents: read
  packages: write
  # Trivy findings land in the Security tab via SARIF; the reusable workflow can
  # only narrow the token it is handed, so the grant has to be here too.
  security-events: write

# Cancel superseded runs on the same ref: avoids parallel races on the
# mutable `latest` tag and saves runners. Event name is part of the group so
# a push-CI run can never cancel an in-flight workflow_dispatch publish
# halfway through (mixed `latest` tags).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Job id left as `discover` — branch protection may reference the check by that
  # name. It runs the same detector as the push-to-main pipeline, so both derive
  # their matrix from one implementation, and tests it on every run.
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      test_dirs: ${{ steps.detect.outputs.test_dirs }}
      has_build: ${{ steps.detect.outputs.has_build }}
      has_test: ${{ steps.detect.outputs.has_test }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's base commit has to be in the clone for the diff.
          # blob:none keeps that history cheap.
          fetch-depth: 0
          filter: blob:none

      - name: Test the detector
        run: bash .github/scripts/detect-changed-connectors_test.sh

      - name: Detect connectors to build
        id: detect
        shell: bash
        env:
          # A dispatch has no baseline to diff against — it rebuilds the whole
          # catalogue on purpose. A pull request is scoped to what it changed.
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
          BASE: ${{ github.event.pull_request.base.sha }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          args=(--root . --head "${GITHUB_SHA}")
          if [ "$FORCE_ALL" = "true" ]; then
            args+=(--force-all)
          else
            # An empty base is the script's "no baseline" case, which selects
            # everything — the safe direction for a gate.
            args+=(--base "$BASE")
          fi
          if [ -n "$IMAGE_TAG" ]; then
            args+=(--tag-override "$IMAGE_TAG")
          fi
          chmod +x .github/scripts/detect-changed-connectors.sh
          .github/scripts/detect-changed-connectors.sh "${args[@]}" >>"$GITHUB_OUTPUT"

  # Job id deliberately left as `test` — branch protection may reference the
  # check by that name. Only the modules that moved are tested: a connector is
  # an independent Go module, so an untouched one cannot regress from a change
  # in its neighbour, and its dependency tree is the slowest part of CI.
  #
  # On a dispatch the detector selects the whole catalogue, so this never skips
  # while `push` is waiting on it.
  test:
    needs: discover
    if: needs.discover.outputs.has_test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Run go tests (changed modules only)
        shell: bash
        env:
          TEST_DIRS: ${{ needs.discover.outputs.test_dirs }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          failed=""
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            echo "::group::go test $dir"
            if ! (cd "$dir" && GOWORK=off go test ./... -count=1); then
              failed="$failed $dir"
            fi
            echo "::endgroup::"
          done < <(printf '%s\n' "$TEST_DIRS")
          if [ -n "$failed" ]; then
            echo "::error::failing modules:$failed"
            exit 1
          fi

  # Job id deliberately left as `build-test` — branch protection may reference the
  # check by that name. It also scans now, via the shared gate, but with the
  # gate disabled (`fail_on: NONE`): PRs get the full vulnerability report and a
  # code-scanning entry without being blocked by CVEs inherited from a base
  # image they did not touch. The push job below is where a finding blocks.
  build-test:
    needs: discover
    if: needs.discover.outputs.has_build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/scan-and-push.yml
    with:
      dir: ${{ matrix.dir }}
      slug: ${{ matrix.slug }}
      tag: ${{ matrix.tag }}
      push: false
      fail_on: 'NONE'

  push:
    needs: [discover, test, build-test]
    # Publish only on explicit dispatch (dry_run=false). On pull_request
    # `inputs` is empty, so this guard also prevents accidental publishes
    # from CI runs.
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/scan-and-push.yml
    with:
      dir: ${{ matrix.dir }}
      slug: ${{ matrix.slug }}
      tag: ${{ matrix.tag }}
      # Dispatch input wins, then the CONNECTOR_SCAN_GATE repository variable,
      # so the policy can be tuned in repo settings without editing this file.
      fail_on: ${{ inputs.scan_gate || vars.CONNECTOR_SCAN_GATE || 'CRITICAL' }}
