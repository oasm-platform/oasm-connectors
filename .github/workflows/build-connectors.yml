name: Build & Push All Connectors

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Override image tag (default: connector version from manifest.yaml)'
        required: false
        default: ''
      dry_run:
        description: 'Build and test only — do NOT push images'
        required: false
        default: false
        type: boolean
  # CI on every change touching the connectors: build + test only — images
  # are published solely via workflow_dispatch (see the push job's guard).
  push:
    paths:
      - 'sdk/**'
      - 'ports_scanner/**'
      - 'vulnerabilities/**'
      - 'url_discovery/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-connectors.yml'
  pull_request:
    paths:
      - 'sdk/**'
      - 'ports_scanner/**'
      - 'vulnerabilities/**'
      - 'url_discovery/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-connectors.yml'

permissions:
  contents: read
  packages: write

# Cancel superseded runs on the same ref: avoids parallel races on the
# mutable `latest` tag and saves runners. Event name is part of the group so
# a push-CI run can never cancel an in-flight workflow_dispatch publish
# halfway through (mixed `latest` tags).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover connectors and build matrix
        id: matrix
        shell: bash
        env:
          IMAGE_TAG_OVERRIDE: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          include=""
          for d in */*/; do
            [ -f "$d/manifest.yaml" ] || continue
            dir="${d%/}"
            slug="$(sed -n 's/^slug:[[:space:]]*//p' "$d/manifest.yaml")"
            version="$(sed -n 's/^version:[[:space:]]*//p' "$d/manifest.yaml")"
            [ -n "$slug" ] && [ -n "$version" ] || { echo "::warning::skip $dir: missing slug/version"; continue; }
            tag="${IMAGE_TAG_OVERRIDE:-$version}"
            entry="$(jq -nc --arg dir "$dir" --arg slug "$slug" --arg version "$version" --arg tag "$tag" '{dir:$dir,slug:$slug,version:$version,tag:$tag}')"
            include="$include${include:+,}$entry"
          done
          matrix="{\"include\":[${include}]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix"

  test:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ needs.discover.outputs.matrix != '{"include":[]}' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Run go tests (root + sdk + each connector)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          GOWORK=off go test ./... -count=1
          (cd sdk && GOWORK=off go test ./... -count=1)
          for d in */*/; do
            [ -f "$d/go.mod" ] || continue
            (cd "$d" && GOWORK=off go test ./... -count=1)
          done

  build-test:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ needs.discover.outputs.matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.dir }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dir }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}
          tags: ghcr.io/${{ github.repository_owner }}/connector-${{ matrix.slug }}:${{ matrix.tag }}

  push:
    needs: [discover, test, build-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Publish only on explicit dispatch (dry_run=false). On push/pull_request
    # events `inputs` is empty, so this guard also prevents accidental
    # publishes from CI runs.
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.dir }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dir }}/Dockerfile
          push: true
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/connector-${{ matrix.slug }}:${{ matrix.tag }}
            ghcr.io/${{ github.repository_owner }}/connector-${{ matrix.slug }}:latest