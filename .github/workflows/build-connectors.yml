name: Build & Push Vulnerability Connectors

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Override image tag (default: connector version from manifest.yaml)'
        required: false
        default: ''

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover connectors and build matrix
        id: matrix
        shell: bash
        env:
          IMAGE_TAG_OVERRIDE: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          include=""
          for d in vulnerabilities/*/; do
            [ -f "$d/manifest.yaml" ] || continue
            dir="${d%/}"
            slug="$(sed -n 's/^slug:[[:space:]]*//p' "$d/manifest.yaml")"
            version="$(sed -n 's/^version:[[:space:]]*//p' "$d/manifest.yaml")"
            [ -n "$slug" ] && [ -n "$version" ] || { echo "::warning::skip $dir: missing slug/version"; continue; }
            tag="${IMAGE_TAG_OVERRIDE:-$version}"
            entry="$(jq -nc --arg dir "$dir" --arg slug "$slug" --arg version "$version" --arg tag "$tag" '{dir:$dir,slug:$slug,version:$version,tag:$tag}')"
            include="$include${include:+,}$entry"
          done
          matrix="{\"include\":[${include}]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix"

  build:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.dir }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dir }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/connector-${{ matrix.slug }}:${{ matrix.tag }}
            ghcr.io/${{ github.repository_owner }}/connector-${{ matrix.slug }}:latest