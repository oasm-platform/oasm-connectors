name: Build, Scan & Publish Connector Image

# Reusable supply-chain gate for connector images: build → scan → (publish).
#
# The image is loaded into the local Docker Engine, scanned there, and only
# pushed to GHCR when the scan passes — so a vulnerable build never reaches the
# registry. Callers keep their own discover/test matrix and forward one
# connector per call:
#
#   publish:
#     needs: [discover, test]
#     strategy:
#       matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
#     uses: ./.github/workflows/scan-and-push.yml
#     with:
#       dir:  ${{ matrix.dir }}
#       slug: ${{ matrix.slug }}
#       tag:  ${{ matrix.tag }}
#
# `push: false` runs the identical build + report without publishing, which is
# what pull-request CI uses.
#
# Actions are pinned to commit SHAs: this job is the gate, so a floating tag on
# the scanner itself would defeat the point. Bump with
# `gh api repos/OWNER/REPO/git/ref/tags/vX.Y.Z` and keep the `# vX.Y.Z` comment
# in sync. The rest of the repo still uses major-version tags.

on:
  workflow_call:
    inputs:
      dir:
        description: 'Connector directory relative to the repo root, e.g. vulnerabilities/nuclei'
        required: true
        type: string
      slug:
        description: 'Connector slug; becomes the image name connector-<slug>'
        required: true
        type: string
      tag:
        description: 'Image tag — the connector version, or an explicit override'
        required: true
        type: string
      push:
        description: 'Push to GHCR once the gate passes. false = build + report only.'
        required: false
        default: true
        type: boolean
      fail_on:
        description: >-
          Severity gate. The job fails (and the push is skipped) when a finding at
          or above this severity survives .trivyignore. NONE turns the gate off and
          leaves the run reporting only. A comma-separated list is a valid
          threshold too.
        required: false
        default: 'CRITICAL'
        type: string
      report_severity:
        description: 'Severities included in the job report, the SARIF and the step summary'
        required: false
        default: 'CRITICAL,HIGH,MEDIUM'
        type: string
      ignore_unfixed:
        description: >-
          Gate only on vulnerabilities that have an upstream fix. Unfixed findings
          come from the base image and cannot be actioned without replacing it, so
          they are reported but not gated by default.
        required: false
        default: true
        type: boolean
      upload_sarif:
        description: 'Publish findings to GitHub code scanning (Security tab)'
        required: false
        default: true
        type: boolean

jobs:
  image:
    name: ${{ inputs.slug }}:${{ inputs.tag }}
    runs-on: ubuntu-latest
    # ZAP and the nuclei template bundle make the build the slow part; 45 is
    # generous enough that only a genuinely stuck build trips it.
    timeout-minutes: 45
    # Granted by the caller too — a called workflow can only narrow the token it
    # is handed, never widen it.
    permissions:
      contents: read
      packages: write # push to GHCR
      security-events: write # SARIF upload
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/connector-${{ inputs.slug }}
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/connector-${{ inputs.slug }}:${{ inputs.tag }}
      # Load-bearing, not cosmetic. By default Trivy looks in the local engine
      # first but silently falls back to the registry, so a scan could pass on an
      # already-published image of the same tag instead of the one just built —
      # a gate that never fires. `docker` restricts it to the local daemon and
      # fails closed when the image is missing.
      TRIVY_IMAGE_SRC: docker
      # Path-scoped allow rules for the secret scanner (nuclei-templates is a
      # detection corpus full of example keys by design). Read by every Trivy
      # step below; vulnerability scanning ignores it.
      TRIVY_SECRET_CONFIG: ${{ github.workspace }}/trivy-secret.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # `load: true` rather than `push: true` is the whole point: the image has
      # to be scannable before it exists in the registry. The publish step below
      # re-runs the same build against the GHA cache written here, so that pass is
      # a cache hit rather than a rebuild.
      - name: Build ${{ inputs.dir }} (${{ inputs.tag }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dir }}/Dockerfile
          load: true
          push: false
          # `runtime` is the final stage of the images that run `apk upgrade` /
          # `apt-get upgrade` to pull OS security fixes released after their
          # upstream tag. That
          # layer's content depends on the package index at build time, not on
          # anything in the repo, so its cache key never changes: a warm cache
          # keeps shipping the packages the first build saw and the scanner then
          # fails on a CRITICAL that already has a fix. Re-running that stage
          # costs seconds; a stale base costs a red main. Connectors without a
          # `runtime` stage are unaffected — buildx ignores unknown filter names.
          no-cache-filters: runtime
          tags: ${{ env.IMAGE_REF }}
          cache-from: type=gha,scope=${{ inputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ inputs.slug }}

      - name: Login to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Everything below inspects the locally loaded image, so every reporting
      # step runs before the gate — a failed gate still leaves a full report,
      # an SBOM and a code-scanning entry behind.
      - name: Report vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          severity: ${{ inputs.report_severity }}
          ignore-unfixed: false
          exit-code: 0
          hide-progress: true
          timeout: 10m
          trivyignores: ${{ github.workspace }}/.trivyignore

      - name: Collect scan report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: json
          output: ${{ runner.temp }}/trivy-report.json
          severity: ${{ inputs.report_severity }}
          ignore-unfixed: false
          exit-code: 0
          hide-progress: true
          timeout: 10m
          trivyignores: ${{ github.workspace }}/.trivyignore

      - name: Publish scan summary
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/trivy-report.json
          REPORT_SEVERITIES: ${{ inputs.report_severity }}
          GATE_SEVERITY: ${{ inputs.fail_on }}
          IGNORE_UNFIXED: ${{ inputs.ignore_unfixed }}
        run: |
          set -euo pipefail
          if [ "$GATE_SEVERITY" = "NONE" ]; then
            gate_note="The vulnerability gate is **disabled** — this run reports only, nothing is blocked."
          elif [ "$IGNORE_UNFIXED" = "true" ]; then
            gate_note="Publishing is gated on **${GATE_SEVERITY}** or higher, counting only findings that have a fix available."
          else
            gate_note="Publishing is gated on **${GATE_SEVERITY}** or higher, unfixed findings included."
          fi
          {
            echo "### 🛡️ \`${IMAGE_REF}\`"
            echo
            echo "| Severity | Findings |"
            echo "| --- | ---: |"
            for severity in CRITICAL HIGH MEDIUM LOW UNKNOWN; do
              count="$(jq --arg severity "$severity" \
                '[.Results[]?.Vulnerabilities[]? | select(.Severity == $severity)] | length' \
                "$REPORT")"
              printf '| %s | %s |\n' "$severity" "$count"
            done
            echo
            echo "Counts cover ${REPORT_SEVERITIES}, unfixed findings included."
            echo "$gate_note"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report-${{ inputs.slug }}-${{ inputs.tag }}
          path: ${{ runner.temp }}/trivy-report.json
          retention-days: 30
          if-no-files-found: error

      # SPDX SBOM of the exact image that ships. Self-uploads as a workflow
      # artifact, so it is the record of what a published tag contained even
      # after the base image is rebuilt.
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_REF }}
          format: spdx-json
          artifact-name: sbom-${{ inputs.slug }}-${{ inputs.tag }}
          syft-version: v1.52.0
          upload-release-assets: false
          dependency-snapshot: false

      - name: Produce SARIF
        if: ${{ inputs.upload_sarif }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: ${{ runner.temp }}/trivy.sarif
          # trivy-action drops the severity filter for SARIF unless told otherwise,
          # which would flood the Security tab with LOW/UNKNOWN noise.
          limit-severities-for-sarif: true
          severity: ${{ inputs.report_severity }}
          ignore-unfixed: false
          exit-code: 0
          hide-progress: true
          timeout: 10m
          trivyignores: ${{ github.workspace }}/.trivyignore

      - name: Upload SARIF to code scanning
        # Forks get a read-only GITHUB_TOKEN and code scanning needs GHAS on
        # private repos, so this channel is best effort: a reporting failure must
        # never be mistaken for a finding.
        if: ${{ inputs.upload_sarif && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          category: connector-image-${{ inputs.slug }}

      # Last step before the push: a non-zero exit here fails the job, so the
      # publish step below is skipped.
      #
      # `fail_on: NONE` skips this step instead of forwarding it. Trivy's
      # --severity is an enum (UNKNOWN/LOW/MEDIUM/HIGH/CRITICAL) with no
      # match-nothing member, so passing NONE through made Trivy exit 1 on a
      # flag parse error and turned every report-only run into a red one — the
      # gate was never actually off, it was just always failing. A genuinely
      # invalid threshold still fails here on purpose: bad config must not
      # silently publish.
      #
      # `scanners: vuln` is load-bearing, not tidiness. Left unset, Trivy falls
      # back to its default `vuln,secret`, and `exit-code: 1` then fails the job
      # on a *secret* finding too — a category that has no severity and cannot
      # be compared against `fail_on` at all. That is not hypothetical: the
      # nuclei image bakes nuclei-templates, which is a detection-rule corpus
      # and is full of example credentials by design (22 RSA private keys used
      # as exploit payloads, example JWTs, and a GCP service-account pattern in
      # http/global-matchers/secrets-patterns-rules.yaml that Trivy rates
      # CRITICAL). Those are the patterns the scanner is supposed to look for,
      # not leaks, and they blocked the nuclei publish.
      #
      # Secret scanning is deliberately left enabled on the reporting steps
      # above, which run with `exit-code: 0` and so surface findings without
      # being able to fail the build. The nuclei-templates corpus is excluded
      # there by path through trivy-secret.yaml (TRIVY_SECRET_CONFIG), so a
      # secret that does show up in the Security tab is worth a look. Gating on
      # secrets is a separate policy; it does not belong to a severity gate.
      - name: Enforce vulnerability gate
        if: ${{ inputs.fail_on != 'NONE' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          scanners: vuln
          severity: ${{ inputs.fail_on }}
          ignore-unfixed: ${{ inputs.ignore_unfixed }}
          exit-code: 1
          hide-progress: true
          timeout: 10m
          trivyignores: ${{ github.workspace }}/.trivyignore

      - name: Push to GHCR
        if: ${{ inputs.push }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dir }}/Dockerfile
          push: true
          cache-from: type=gha,scope=${{ inputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ inputs.slug }}
          tags: |
            ${{ env.IMAGE_REF }}
            ${{ env.IMAGE_REPO }}:latest
