# Trivy secret-scanner config for connector images — consumed by
# .github/workflows/scan-and-push.yml via TRIVY_SECRET_CONFIG. Only the secret
# scanner reads it; vulnerability findings in the same paths still surface.
#
# An allow rule silences every secret match under a path, for every image, so
# each entry has to name a path that holds detection content or fixtures by
# design, never one the connector writes or reads credentials from.
allow-rules:
  # nuclei-templates is a detection-rule corpus baked into the nuclei image.
  # Its "secrets" are exploit payloads and match patterns: the published
  # VMware vRNI keys for CVE-2023-34039, example JWTs in CVE templates, and the
  # GCP service-account regex in http/global-matchers/secrets-patterns-rules.yaml.
  # They are what the scanner looks for, not leaked credentials, and they put
  # ~40 false positives in code scanning on every nuclei build.
  - id: nuclei-templates
    description: nuclei-templates detection corpus (payloads and match patterns)
    path: ^/?opt/nuclei-templates/
