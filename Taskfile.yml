version: "3"

vars:
  GO:
    sh: echo ${GO:-go}
  # go.work is the single source of truth for the module list.
  MODULES:
    sh: '{{.GO}} work edit -json | sed -n "s/.*\"DiskPath\": \"\(.*\)\".*/\1/p"'

tasks:
  proto:
    desc: regenerate sdk/proto/gen from sdk/proto/connector.proto (needs buf)
    dir: sdk/proto
    cmds:
      # Plugin versions pinned to the ones that produced the committed stubs.
      - "{{.GO}} install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12"
      - "{{.GO}} install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2"
      - >-
        buf generate --template
        '{"version":"v2","plugins":[{"local":"protoc-gen-go","out":"gen","opt":"paths=source_relative"},{"local":"protoc-gen-go-grpc","out":"gen","opt":"paths=source_relative"}]}'
        .

  test-race:
    desc: run the SDK tests under the race detector (needs cgo)
    dir: sdk
    cmds:
      - "CGO_ENABLED=1 {{.GO}} test -race -count=1 ./..."

  test:
    desc: run all tests
    cmds:
      - for:
          var: MODULES
        cmd: "cd {{.ITEM}} && {{.GO}} test ./... -v -count=1"

  vet:
    desc: go vet
    cmds:
      - for:
          var: MODULES
        cmd: "cd {{.ITEM}} && {{.GO}} vet ./..."

  fmt:
    desc: format
    cmds:
      - for:
          var: MODULES
        cmd: "cd {{.ITEM}} && {{.GO}} fmt ./..."

  tidy:
    desc: tidy modules
    cmds:
      - for:
          var: MODULES
        cmd: "cd {{.ITEM}} && GOWORK=off {{.GO}} mod tidy"

  manifest:
    desc: regenerate manifest.json from <category>/<connector>/manifest.yaml
    cmds:
      - "{{.GO}} run ./scripts/combine-manifest -root ."

  ci-scope:
    desc: report which connectors the last commit would rebuild and test
    cmds:
      - "bash .github/scripts/detect-changed-connectors.sh --base HEAD~1 --head HEAD"
    silent: false

  ci-test:
    desc: unit-test the CI change detector
    cmds:
      - "bash .github/scripts/detect-changed-connectors_test.sh"

  default:
    desc: default task (runs test)
    deps: [test]
    silent: true
