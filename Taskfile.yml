version: '3'

vars:
  GO:
    sh: echo ${GO:-go}
  PROTO_DIR:
    sh: echo ${PROTO_DIR:-proto}
  MODULES:
    - '.'
    - './sdk'
    - './vulnerabilities/nuclei'
    - './vulnerabilities/wpscan'

tasks:
  proto:
    desc: generate protobuf stubs (requires buf or protoc)
    # ponytail: no proto files yet, stub target — keep mkdir until real buf/protoc generation is wired
    cmds:
      - 'echo "proto: ponytail - no proto files yet, stub target"'
      - 'mkdir -p {{.PROTO_DIR}}'
    silent: true

  test:
    desc: run all tests
    cmds:
      - for:
          var: MODULES
        cmd: 'cd {{.ITEM}} && {{.GO}} test ./... -v -count=1'

  vet:
    desc: go vet
    cmds:
      - for:
          var: MODULES
        cmd: 'cd {{.ITEM}} && {{.GO}} vet ./...'

  fmt:
    desc: format
    cmds:
      - for:
          var: MODULES
        cmd: 'cd {{.ITEM}} && {{.GO}} fmt ./...'

  tidy:
    desc: tidy modules
    cmds:
      - for:
          var: MODULES
        cmd: 'cd {{.ITEM}} && GOWORK=off {{.GO}} mod tidy'

  manifest:
    desc: regenerate manifest.json from <category>/<connector>/manifest.yaml
    cmds:
      - '{{.GO}} run ./cmd/combine-manifest -root .'

  default:
    desc: default task (runs test)
    deps: [test]
    silent: true
