# connector image (SDK+tool) — built from ./Dockerfile, not upstream image
name: Gitleaks - Secret Scanner
slug: gitleaks
version: 8.30.1
image: ghcr.io/oasm-platform/connector-gitleaks:8.30.1
author: 'oasm'
pricingTier: [free]
homepage: 'https://gitleaks.io'
repositoryUrl: 'https://github.com/oasm-platform/oasm-connectors'
supportUrl: 'https://github.com/oasm-platform/oasm-connectors/issues'
shortDescription: 'Finds secrets committed to Git repositories'
description: 'Scans the repositories of a Git organization for committed credentials — API keys, tokens, private keys, passwords — with Gitleaks rules. Secret values are redacted at the source: findings name the rule, file, line and commit, never the secret itself. Optionally scans recent history, where deleted secrets remain exposed.'
capabilities:
  - name: secrets
    targetTypes: [git_org]
    inputsSchema:
      type: object
      required: [repository]
      properties:
        repository:
          type: string
          format: uri
          title: Repository
          description: 'https clone URL of the repository to scan.'
          examples: [https://github.com/acme/web]
        ref:
          type: string
          title: Ref
          description: 'Branch, tag or commit to scan. Empty scans the default branch.'
        username:
          type: string
          title: Username
          description: 'HTTP user for private repositories.'
        token:
          type: string
          title: Token
          description: 'Access token for private repositories.'
          ui:widget: password
      additionalProperties: false
agentTool: true
# Filled by the platform for each repository (sdk/gitrepo contract).
configSchema:
  type: object
  additionalProperties: false
  properties:
    scanHistory:
      type: boolean
      default: false
      title: Scan history
      description: 'Also scan recent commits. A secret deleted from the code is still exposed in history.'
    historyDepth:
      type: integer
      default: 100
      minimum: 1
      maximum: 5000
      title: History depth
      description: 'Number of most recent commits scanned when "Scan history" is on.'
resourceDefaults:
  cpu: 500m
  memory: 1024Mi
  timeoutSeconds: 1800
